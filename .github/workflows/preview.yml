name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/login-action@v3
        if: github.event.action != 'closed'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: github.event.action != 'closed'
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha }}

      - uses: alternayte/kiln/.github/actions/preview@v0.9.4
        with:
          url: ${{ vars.KILN_URL }}
          api-key: ${{ secrets.KILN_API_KEY }}
          image: ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha }}
          # The host pulls with the job token for this build, and stores nothing.
          registry-token: ${{ github.token }}
          port: "3000"
          # Kiln ignores the image command, so this names the server with absolute paths.
          start: /usr/local/bin/node /app/node_modules/.bin/next start /app -p 3000
          egress-allow: api.atmosbot.com
