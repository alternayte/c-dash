version: 1
bootstrap:
  command: 'curl -fsSL https://opencode.ai/install | bash'
agents:
  implementer: opencode
  validator: opencode
  reviewer: opencode
sandbox:
  allowedDomains:
    - opencode.ai
    - api.github.com
    - github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com            # the installer script
    - release-assets.githubusercontent.com # the binary download    
    - registry.npmjs.org
verify:
  commands:
    - name: noop
      run: 'true'
