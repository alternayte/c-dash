version: 1
identity:
  product: factoree-test
  linear:
    teamKey: FAC
bootstrap:
  # A Fly Sprite holds no opencode, so the bootstrap installs it in the user's home. npm 12 runs
  # no install script, so the bootstrap runs the opencode postinstall that links the binary. The
  # Factoree sandbox image on Kiln already holds opencode, so the install is skipped there.
  command: 'if ! command -v opencode >/dev/null; then npm install -g --prefix "$HOME/.local" opencode-ai && (cd "$HOME/.local/lib/node_modules/opencode-ai" && node postinstall.mjs); fi && npm ci --no-audit --no-fund'
agents:
  implementer: opencode
  validator: opencode
  reviewer: opencode
sandbox:
  allowedDomains:
    - registry.npmjs.org # opencode and npm ci
    - api.deepseek.com   # the model API (DeepSeek, set by the worker)
    - models.dev         # the opencode model list
verify:
  commands:
    - name: type-check
      run: 'npm run type-check'
    - name: test
      run: 'npm test'
preview:
  # Factoree starts this in the check sprite and captures screenshots of visible changes. The
  # implementer also opens it with agent-browser to check its own work.
  enabled: true
  command: 'npm run build && npx next start -p 3000'
  readyUrl: 'http://localhost:3000/'
  timeoutSeconds: 600
