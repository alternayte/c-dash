version: 1
identity:
  product: factoree-test
  linear:
    teamKey: FAC
bootstrap:
  # The sprite holds no opencode. npm 12 runs no install script, so the bootstrap runs the
  # opencode postinstall that links the binary. Then it installs the dependencies of the app.
  command: 'npm install -g --prefix /home/sprite/.local opencode-ai && (cd /home/sprite/.local/lib/node_modules/opencode-ai && node postinstall.mjs) && npm ci --no-audit --no-fund'
agents:
  implementer: opencode
  validator: opencode
  reviewer: opencode
sandbox:
  allowedDomains:
    - registry.npmjs.org # opencode and npm ci
    - api.deepseek.com   # the model API (DeepSeek, set by the worker)
    - models.dev         # the opencode model list
verify:
  commands:
    - name: type-check
      run: 'npm run type-check'
    - name: test
      run: 'npm test'
preview:
  # Factoree starts this in the check sprite and captures screenshots of visible changes. The
  # implementer also opens it with agent-browser to check its own work.
  enabled: true
  command: 'npm run build && npx next start -p 3000'
  readyUrl: 'http://localhost:3000/'
  timeoutSeconds: 600
